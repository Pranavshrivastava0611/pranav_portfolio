<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Radial glow background -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e31837" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e31837" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Neon blur filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur1" />
      <feGaussianBlur stdDeviation="2.4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark styled background -->
  <rect width="32" height="32" fill="#0e0e0e"/>
  
  <!-- Subtle ambient glow -->
  <circle cx="16" cy="16" r="14" fill="url(#glowGrad)"/>
  
  <!-- Outer red thin circle border -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#2a2a2a" stroke-width="1"/>
  <circle cx="16" cy="16" r="14" fill="none" stroke="#e31837" stroke-width="1" opacity="0.3" filter="url(#neonGlow)"/>

  <!-- Stylized "V" for THE VOID / Rift symbol -->
  <g filter="url(#neonGlow)">
    <!-- Left slash of the V -->
    <path d="M 9 8 L 16 23" stroke="#e31837" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Right slash of the V, offset slightly to look like a cracked rift -->
    <path d="M 23 8 L 16 23" stroke="#b20710" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Bright inner core for a realistic neon look -->
    <path d="M 9 8 L 16 23" stroke="#ffb3b1" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M 23 8 L 16 23" stroke="#ffd6d5" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- Horizontal glitch scanlines across the icon -->
  <line x1="2" y1="12" x2="30" y2="12" stroke="#000" stroke-width="0.6" opacity="0.4"/>
  <line x1="2" y1="20" x2="30" y2="20" stroke="#000" stroke-width="0.6" opacity="0.4"/>
</svg>
